name: Base-updated PR CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  list-open-prs:
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.prs.outputs.prs }}
    steps:
      - id: prs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prs=$(gh pr list \
            --base main \
            --state open \
            --json number,headRefOid \
            --jq '[.[] | {number, sha: .headRefOid}]')

          echo "prs=$prs" >> "$GITHUB_OUTPUT"

  test-open-pr:
    needs: list-open-prs
    if: needs.list-open-prs.outputs.prs != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJson(needs.list-open-prs.outputs.prs) }}

    steps:
      - name: Mark PR status as pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            -X POST \
            repos/${{ github.repository }}/statuses/${{ matrix.pr.sha }} \
            -f state=pending \
            -f context=base-updated-ci \
            -f description="Testing this PR against latest main" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Checkout PR merge ref
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ matrix.pr.number }}/merge

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Mark PR status as success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            -X POST \
            repos/${{ github.repository }}/statuses/${{ matrix.pr.sha }} \
            -f state=success \
            -f context=base-updated-ci \
            -f description="Passed against latest main" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Mark PR status as failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            -X POST \
            repos/${{ github.repository }}/statuses/${{ matrix.pr.sha }} \
            -f state=failure \
            -f context=base-updated-ci \
            -f description="Failed against latest main" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"